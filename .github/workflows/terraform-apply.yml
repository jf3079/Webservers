name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-network-vpc
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.16"
          terraform_wrapper: false # wrapper buffers output; needed off for live streaming

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -input=false

      # Streams apply output live into the merged PR's comment (and the Actions log).
      - name: Terraform apply
        id: apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # PR that was merged into this commit (empty for manual dispatch with no PR).
          export PR_NUMBER=$(gh api "repos/${REPO}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')
          bash .github/scripts/live-comment.sh "Terraform Apply" apply.txt terraform apply -input=false -auto-approve -no-color
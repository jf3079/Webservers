name: Show OIDC subject

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)

          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, repository_owner, ref, environment}'
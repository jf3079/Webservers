name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-network-vpc
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_region: ${{ vars.REGION }}
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.16"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -input=false

      # Plan runs first after the merge; apply then applies exactly this saved plan.
      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Terraform apply
        id: apply
        run: |
          set -o pipefail
          terraform apply -input=false -no-color tfplan 2>&1 | tee apply.txt

      - name: Build PR comment
        if: ${{ always() && steps.plan.outcome != 'skipped' }}
        run: |
          {
            echo "### Terraform Plan: ${{ steps.plan.outcome }}"
            echo '```diff'
            sed -E 's/^( *)\+/+\1/; s/^( *)-/-\1/; s/^( *)~/!\1/' plan.txt | head -c 30000
            echo
            echo '```'
            if [ "${{ steps.apply.outcome }}" != "skipped" ]; then
              echo "### Terraform Apply: ${{ steps.apply.outcome }}"
              echo '```diff'
              sed -E 's/^( *)\+/+\1/; s/^( *)-/-\1/; s/^( *)~/!\1/' apply.txt | head -c 30000
              echo
              echo '```'
            fi
          } > comment.md

      # Post plan + apply output on the PR that was merged into this commit.
      - name: Comment plan and apply on merged PR
        if: ${{ always() && steps.plan.outcome != 'skipped' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            if (!prs.length) {
              core.info('No PR associated with this commit; skipping comment.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prs[0].number,
              body,
            });